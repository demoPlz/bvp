robot_cfg:
  dt: 0.05
  urdf_path: assembly/wxai_base/wxai_arm_right.urdf

  kinematics:
    ik_damping: 1e-3
    eps: 1e-3
    ee_link: link_6

  # Optional: link-aware keep-out guard (planes & cylinders)
  # Set enabled: true and tune frames/obstacles for your setup
  collision_guard:
    enabled: true
    frame_radius_m: 0.02
    min_scale: 0.02  # hold cleanly if no safe scale found
    max_backtrack: 10
    frame_names:
      - base_link
      - link_1
      - link_2
      - link_3
      - link_4
      - link_5
      - link_6
      - gripper_base
      - gripper_tip
    planes:
      - name: left_9in
        point: [0.0, -0.2286, 0.0]
        normal: [0.0, 1.0, 0.0]
        margin: 0.0
      - name: right_9in
        point: [0.0, 0.2286, 0.0]
        normal: [0.0, -1.0, 0.0]
        margin: 0.0
    cylinders:
      # Vertical cage posts (keep 1" margin around 3/4" rods)
      - name: pillar_front_left
        center_xy: [-0.3429, -0.2286]
        radius: 0.01905
        margin: 0.0254
      - name: pillar_back_left
        center_xy: [-0.3429, 0.2286]
        radius: 0.01905
        margin: 0.0254
      - name: pillar_front_right
        center_xy: [0.3429, -0.2286]
        radius: 0.01905
        margin: 0.0254
      - name: pillar_back_right
        center_xy: [0.3429, 0.2286]
        radius: 0.01905
        margin: 0.0254
